# ============================================================
# WhatsApp AI Agent — Docker Compose (LOCAL)
# ============================================================
# Uso: docker compose -f docker-compose.local.yml up -d
#
# Esto levanta:
#   - Bot de WhatsApp (SÓLO el bot Baileys). El dashboard/web corre
#     en el host con `npm run dev` (puerto 3000), así que aquí NO se
#     publica el puerto 3000 para evitar conflicto con el host.
#
# El bot persiste en Supabase (conversations/messages) y en la sesión
# de WhatsApp de ./auth (bind mount). Usa el mismo .env.local del host.
# ============================================================

services:
  whatsapp-agent:
    container_name: whatsapp-agent
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
      - ./prompts:/app/prompts
      - ./docs:/app/docs
      - ./.env.local:/app/.env.local:ro
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=debug
    networks:
      - default
